[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
priority=10
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -rfbport 5900 -listen 0.0.0.0
priority=20
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

[program:api]
command=uvicorn api.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=40
autorestart=true
environment=DISPLAY=":99",RUNNING_IN_DOCKER="1",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.err
